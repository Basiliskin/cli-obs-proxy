version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cliobs
      POSTGRES_PASSWORD: cliobs
      POSTGRES_DB: cliobs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliobs"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    build: ./proxy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://cliobs:cliobs@postgres:5432/cliobs"
      MAX_TOKEN_PARSE_BYTES: "10000000"
      ENABLE_OPENAI_USAGE_INJECTION: "false"
    volumes:
      - mitmproxy_certs:/home/root/.mitmproxy
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://cliobs:cliobs@postgres:5432/cliobs"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mitmproxy_certs: