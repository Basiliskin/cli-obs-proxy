version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cliobs
      POSTGRES_PASSWORD: cliobs
      POSTGRES_DB: cliobs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliobs"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    build: ./proxy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://cliobs:cliobs@postgres:5432/cliobs"

      # Maximum response body size used for token parsing.
      # For larger bodies, the parser keeps beginning + end only.
      MAX_TOKEN_PARSE_BYTES: "10000000"

      # Disabled by default.
      # Set to true only if your OpenAI-compatible provider supports:
      # stream_options.include_usage
      ENABLE_OPENAI_USAGE_INJECTION: "true"

    volumes:
      - mitmproxy_certs:/home/root/.mitmproxy
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mitmproxy_certs: